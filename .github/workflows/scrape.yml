name: FMScouts Scraper

on:
  schedule:
    - cron: '17 3 * * 2'          # Úterý 3:17 UTC — hráči + zápasy
    - cron: '23 3 * * 5'          # Pátek 3:23 UTC — hráči + zápasy
    - cron: '41 4 * * 0,1,3,4,6'  # Ne/Po/St/Čt/So 4:41 UTC — jen zápasy (Út a Pá už mají zápasy výš)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Co spustit'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - players
          - matches
      days_back:
        description: 'Kolik dní zpět (0 = celá sezóna, výchozí 14)'
        required: false
        default: '14'
      leagues_mode:
        description: 'Které ligy (all = všechny, spring_fall = jen jaro-podzim)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - spring_fall

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape players
        if: >-
          github.event.schedule == '17 3 * * 2' ||
          github.event.schedule == '23 3 * * 5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'matches')
        run: python scraper.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - name: Commit player data
        if: >-
          github.event.schedule == '17 3 * * 2' ||
          github.event.schedule == '23 3 * * 5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'matches')
        run: |
          git config user.name "FMScouts Bot"
          git config user.email "bot@fmscouts.com"
          git add data/players.json
          git diff --staged --quiet || git commit -m "Players update $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Scrape matches
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'players')
        run: python scraper_matches.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '14' }}
          LEAGUES_MODE: ${{ github.event.inputs.leagues_mode || 'all' }}
