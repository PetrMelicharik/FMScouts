name: Migrate Contract Dates

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run migration
        run: python migrate_contract_dates.py

      - name: Commit updated tm_data.json
        run: |
          git config user.name "FMScouts Bot"
          git config user.email "bot@fmscouts.com"
          git add data/tm_data.json
          git diff --staged --quiet || git commit -m "Migrate contract dates $(date +'%Y-%m-%d %H:%M')"
          git push
